<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f7fb">
<title>YagoSeek — Search</title>
<link rel="search" type="application/opensearchdescription+xml" title="YagoSeek" href="/opensearchdescription.xml">
<style>
:root{color-scheme:light dark;--ink:#192433;--muted:#5f6f82;--line:#d8e1eb;--paper:#fff;--wash:#f4f7fb;--blue:#1769aa;--blue-deep:#0e4f83;--focus:#f2a900;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--wash);color:var(--ink)}
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:flex;flex-direction:column}a{color:var(--blue)}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.topbar{height:68px;padding:0 clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--paper)}.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);font-size:1.15rem;font-weight:750;letter-spacing:-.035em;text-decoration:none}.brand-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--blue);color:#fff;font-size:1rem;font-weight:800}.top-link{font-size:.92rem;font-weight:600;text-decoration:none}.home{width:min(760px,100% - 32px);margin:auto;transform:translateY(-5vh);text-align:center}.wordmark{margin:0;color:var(--blue-deep);font-size:clamp(2.8rem,8vw,4.8rem);font-weight:760;letter-spacing:-.075em;line-height:1.05}.tagline{margin:14px 0 30px;color:var(--muted);font-size:1.08rem}.search-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin:0 auto;padding:8px;border:1px solid #bac9d9;border-radius:16px;background:var(--paper);box-shadow:0 12px 35px #203c5b16}.query-wrap{display:flex;align-items:center;gap:12px;min-width:0;padding-left:12px}.search-icon{width:19px;height:19px;flex:none;color:var(--muted)}.query{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;outline:none}.query:focus-visible{outline:0}.query::placeholder{color:#748397;opacity:1}.search-button{min-height:48px;padding:0 24px;border:0;border-radius:11px;background:var(--blue);color:white;font:inherit;font-weight:680;cursor:pointer}.search-button:hover{background:var(--blue-deep)}.options{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px auto 0;color:var(--muted);font-size:.9rem}.options label{font-weight:600}.scope{min-height:38px;padding:5px 34px 5px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}.hint{margin:25px 0 0;color:var(--muted);font-size:.88rem}.footer{padding:20px;text-align:center;color:var(--muted);font-size:.8rem}.version{margin:6px 0 0;color:var(--muted);font-size:.76rem}@media(max-width:520px){.topbar{height:60px;padding:0 18px}.home{transform:translateY(-2vh)}.search-form{grid-template-columns:1fr;padding:7px}.query-wrap{min-height:48px}.search-button{width:100%}.options{margin-top:14px}}@media(prefers-color-scheme:dark){:root{--ink:#e8eef5;--muted:#adbdce;--line:#34475b;--paper:#182432;--wash:#101923;--blue:#4c9fe0;--blue-deep:#79baf0}.brand-mark{color:#101923}.search-form{border-color:#40566b;box-shadow:0 12px 35px #0005}.query::placeholder{color:#aab9c9}}
</style>
<style>
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="/" aria-label="YagoSeek home"><span class="brand-mark" aria-hidden="true">Y</span><span>YagoSeek</span></a>
<a class="top-link" href="/account/login">Sign in</a>
</header>
<main class="home">
<h1 class="wordmark">YagoSeek</h1>
<p class="tagline">Search this node or explore the YaCy network.</p>
<form class="search-form" id="home-query-form" method="get" action="/yacysearch.html" role="search">
<div class="query-wrap">
<svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"></circle><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
<label for="home-query" class="visually-hidden">Search terms</label>
<input class="query" id="home-query" name="query" type="search" maxlength="200" placeholder="Search the web" autocomplete="off" autofocus required>
</div>
<button class="search-button" type="submit">Search</button>
</form>
<div class="options">
<label for="home-resource">Search scope</label>
<select class="scope" id="home-resource" name="resource" form="home-query-form">
<option value="local">This node</option>
<option value="global">YaCy network</option>
</select>
</div>
<p class="hint">Choose “This node” for the local index, or “YaCy network” to include reachable peers.</p>
{{if .Version}}<p class="version">YagoSeek {{.Version}}</p>{{end}}
</main>
<footer class="footer"><a href="https://github.com/D4rk4/yago">About this search node</a></footer>
</body>
</html>
